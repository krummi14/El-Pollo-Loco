<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/babychicken.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/status-bar.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/collectibles.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
</head>

<body>
    <div id="startScreen" class="start_screen">
        <img src="img/animation/leaf.png" class="leaf" style="animation-delay: 0s">
        <img src="img/animation/leaf2.png" class="leaf" style="animation-delay: 2s">
        <img src="img/animation/leaf2.png" class="leaf" style="animation-delay: 5s">
        <div class="startscreen_btns">
            <button id="startBtn" class="generally_btn start_btn" onclick="startGame()">Start Game</button>
            <button id="optnBtn" class="generally_btn optn_btn" onclick="openOption()">Options</button>
            <button id="introBtn" class="generally_btn intro_btn" onclick="openGameIntro()">Game Story</button>
        </div>
    </div>

    <div id="fullscreen" class="fullscreen display_none">
        <h1>El Pollo Loco</h1>
        <canvas id="canvas" class="canvas" width="720px" height="480px">

        </canvas>
        <button class="fullscreen_btn" onclick="toggleFullscreen()">⛶</button>
    </div>
    <script src="js/game.js"></script>
</body>

</html>
